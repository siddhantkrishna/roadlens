[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roadlens"
version = "0.1.0"
description = "Native macOS vehicle detection and local traffic intelligence"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
authors = [{name = "ROADLENS contributors"}]
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2,<3",
  "opencv-python==4.13.0.92",
  "supervision==0.31.2",
  "requests>=2.32,<3",
  "PySide6-Essentials>=6.8,<7",
]

[project.urls]
Repository = "https://github.com/siddhantkrishna/roadlens"
Issues = "https://github.com/siddhantkrishna/roadlens/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
build = ["pyinstaller>=6.16,<7"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3", "detect-secrets>=1.5,<2", "build>=1.2,<2"]

[project.scripts]
roadlens = "roadlens.cli:main"

[project.gui-scripts]
roadlens-desktop = "roadlens.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadlens = ["native/*.m", "native/*.plist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: real ONNX inference (requires downloaded weights)",
  "hardware: opt-in real macOS camera capture",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
